apiVersion: apps/v1
kind: Deployment
metadata: 
  name: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec: 
      containers: 
        - name: devops-app
          image: abdulhaseebkhokhar/devops:e2114848c8222a1f94e812b791af1bd749e64b05
          ports:
            - containerPort: 5000

